name: Build Playtest APK

on:
  push:
    branches:
      - playtest/apk-arena-01a0a88a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout playtest branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Black-Sword-Arena-Playtest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Black-Sword-Arena-Playtest
          path: Black-Sword-Arena-Playtest.apk
          if-no-files-found: error
          retention-days: 14
